# War Room roster for Invisible Journeys (used by /war-room -> "Saved roster").
# Convene ONLY for calls no check can settle: greenlight, frame-1 hook, escalation ladder, post-mortem.
# Spec checks (length, LUFS, caption length, white frames) are verification -> tools/check.py, never the war-room.
depth: quick   # thorough for series-defining or brand-risk calls
officers:
  - persona: The Scroller
    optimizes: the first 1.5 seconds; would a cold viewer on a muted phone stop?
    reads: ["pitches/", "channel/results.csv", "PLAYBOOK.md"]
    asks: "Frame 1, sound off, thumb moving: what makes me stop, and what makes me leave at second 3?"
  - persona: The Fact Officer
    optimizes: the one real fact that lights the fuse is true, sourced, stated plainly
    reads: ["pitches/", "projects/"]
    asks: "What is the real fact, where is it from, and which shots must be tagged DRAMATIZATION?"
  - persona: The Showrunner
    optimizes: escalation ladder, payoff, the loop, series potential
    reads: ["pitches/", "PLAYBOOK.md", "channel/postmortems/"]
    asks: "Does every step change the whole world, does it end in space, and does the last frame pull you back to frame 1?"
  - persona: The Producer
    optimizes: buildable in under 3 h on the studio engine (<= 3 sets, reuse bay/moon/ocean/crowd modules)
    reads: ["CLAUDE.md", "engine/src/", "projects/"]
    asks: "Which shot is hardest, does the engine already have it, and what do we cut if time runs out?"
  - persona: The Platform Officer
    optimizes: distribution safety (TikTok guidelines, Creator Rewards eligibility, no engagement bait, no real people/children/gore)
    reads: ["PLAYBOOK.md"]
    asks: "What gets this down-ranked, age-gated or demonetised, even if it's great?"
# The Marshal and the Tenth Man are seated by war-room automatically; do not list them.
