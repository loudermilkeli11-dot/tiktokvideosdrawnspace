<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Anton'; src: url('fonts/anton-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Azeret Mono'; src: url('fonts/azeret-mono-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
@font-face { font-family: 'Azeret Mono'; src: url('fonts/azeret-mono-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
@font-face { font-family: 'Big Shoulders Display'; src: url('fonts/big-shoulders-display-latin-800-normal.woff2') format('woff2'); font-weight: 800; }
@font-face { font-family: 'Big Shoulders Display'; src: url('fonts/big-shoulders-display-latin-900-normal.woff2') format('woff2'); font-weight: 900; }
@font-face { font-family: 'Inter Tight'; src: url('fonts/inter-tight-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
@font-face { font-family: 'Inter Tight'; src: url('fonts/inter-tight-latin-800-normal.woff2') format('woff2'); font-weight: 800; }
@font-face { font-family: 'Instrument Serif'; src: url('fonts/instrument-serif-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'Instrument Serif'; src: url('fonts/instrument-serif-latin-400-italic.woff2') format('woff2'); font-weight: 400; font-style: italic; }
@font-face { font-family: 'Space Grotesk'; src: url('fonts/space-grotesk-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
html, body { margin: 0; background: transparent; }
canvas { display: block; }
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// Overlay layer renderer. Driven by render_ov.js through window.ov.*
// Design space is 540x960; everything is drawn with a 2x transform.
const FPS = 30, S = 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Channel look (Commander's pick 2026-11-11): 'documentary' = Big Shoulders Display 900 captions, amber payoff words,
// soft shadow + top scrim, boxless Inter Tight counter. 'classic' = the original Anton/Azeret Mono look.
const LOOKS = {
  documentary: { look: 'documentary', accent: '#FFB347', capFont: "'Big Shoulders Display'", capWeight: 900, capSize: 50, capMinSize: 30,
    capStroke: 0, capShadow: 0, capBlur: 18, capShadowCol: 'rgba(0,0,0,0.85)', capTrack: 0.5, scrim: 0.55, scrimY: 400 },
  classic: { look: 'classic', accent: '#FFD23F', capFont: 'Anton', capWeight: 400, capSize: 46, capMinSize: 26, capStroke: 8, capShadow: 3.5, capBlur: 0, capTrack: 0, scrim: 0 },
  // Studio v2, type A (approved 2026-11-11, projects/gravity-flip/first_look.jpg): see the v2 section below.
  v2: { look: 'v2', accent: '#FFC04D', scrim: 0 },
};
const DEFAULT_STYLE = {
  ...LOOKS.documentary,
  capMaxW: 480, capY0: 230, capY1: 350,
  // capStroke: design px outline (classic); capShadow: hard shadow offset (classic); capBlur: soft shadow (documentary)
  capLineGap: 1.02,
  capPunchFrames: 4, capPunchScale: 1.12, capOutFrames: 2,
  panelY0: 129, panelY1: 210, panelW: 380,
  pulseFrames: 6, pulseScale: 1.08,
  tagX: 26, tagY: 110,
};
let SPEC = null, ST = DEFAULT_STYLE, TOTAL = 0;

const easeOut = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const fmtThousands = v => {
  if (typeof v !== 'number') return String(v);
  const neg = v < 0; v = Math.abs(v);
  const r = Math.round(v);
  return (neg ? '-' : '') + r.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
};
const fr = t => Math.round(t * FPS);   // seconds -> frame

// ---------------- captions ----------------
const capFontStr = (size) => `${ST.capWeight || 400} ${size}px ${ST.capFont}`;
function layoutCaption(text, hl, size, force) {
  ctx.font = capFontStr(size); ctx.letterSpacing = (ST.capTrack || 0) + 'px';
  // explicit line break: "first line | second line"
  if (text.includes('|')) {
    const parts = text.split('|').map((t) => t.trim()).filter(Boolean).slice(0, 2);
    const space = ctx.measureText(' ').width * 1.15 + ST.capStroke * 0.35;
    const lines = parts.map((t) => t.toUpperCase().split(/\s+/).filter(Boolean).map((w) => ({ w, width: ctx.measureText(w).width, hl: hl.includes(w.replace(/[^A-Z0-9×%]/g, '')) })));
    const widths = lines.map((l) => l.reduce((a, b) => a + b.width, 0) + space * (l.length - 1));
    if (Math.max(...widths) <= ST.capMaxW || force) return { lines, widths, size, space };
    return null;
  }
  const words = text.toUpperCase().split(/\s+/).filter(Boolean);
  const space = ctx.measureText(' ').width * 1.15 + ST.capStroke * 0.35; // outline eats the gap
  const ws = words.map(w => ({ w, width: ctx.measureText(w).width,
    hl: hl.includes(w.replace(/[^A-Z0-9×%]/g, '')) }));
  // try 1 line, else best balanced 2-line split
  const total = ws.reduce((a, b) => a + b.width, 0) + space * (ws.length - 1);
  if (total <= ST.capMaxW || (ws.length < 2 && force)) return { lines: [ws], widths: [total], size, space };
  if (ws.length < 2) return null;
  let best = null;
  for (let k = 1; k < ws.length; k++) {
    const a = ws.slice(0, k), b = ws.slice(k);
    const wa = a.reduce((s, x) => s + x.width, 0) + space * (a.length - 1);
    const wb = b.reduce((s, x) => s + x.width, 0) + space * (b.length - 1);
    const m = Math.max(wa, wb);
    if (!best || m < best.m) best = { m, lines: [a, b], widths: [wa, wb] };
  }
  if (best.m <= ST.capMaxW || force) return { lines: best.lines, widths: best.widths, size, space };
  return null;
}
function drawScrim() { // top darkening so captions and counter sit on a calm, dark background
  if (!ST.scrim) return; ctx.save(); ctx.setTransform(S, 0, 0, S, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, ST.scrimY); g.addColorStop(0, `rgba(0,0,0,${ST.scrim})`); g.addColorStop(0.6, `rgba(0,0,0,${ST.scrim * 0.45})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 540, ST.scrimY); ctx.restore();
}
const capCache = new Map();
function fitCaption(text, hl) {
  const key = text + '|' + hl.join(',');
  if (capCache.has(key)) return capCache.get(key);
  let L = null;
  for (let s = ST.capSize; s >= ST.capMinSize && !L; s -= 1) {
    L = layoutCaption(text, hl, s);
    if (L) { // must also fit vertically in the caption band
      const h = L.lines.length * s * ST.capLineGap * 1.18;
      if (h > (ST.capY1 - ST.capY0) + 10) L = null;
    }

  if (!L) L = layoutCaption(text, hl, ST.capMinSize, true);
  capCache.set(key, L);
  return L;
}
function drawCaption(c, f) {
  const f0 = fr(c.t0), f1 = fr(c.t1);
  if (f < f0 || f >= f1) return;
  // exit: last capOutFrames frames cut out (scale squeeze + gone), no slow fade
  const fromEnd = f1 - f;
  if (fromEnd <= ST.capOutFrames && c.cutOut !== false) {
    if (fromEnd === 1) return;     // final frame: gone (hard cut out)
  }
  const L = fitCaption(c.text, (c.hl || []).map(w => w.toUpperCase().replace(/[^A-Z0-9×%]/g, '')));
  const k = (f - f0) / ST.capPunchFrames;
  let sc = c.punch === false ? 1 : ST.capPunchScale + (1 - ST.capPunchScale) * easeOut(k);
  if (fromEnd === 2 && c.cutOut !== false) sc *= 0.96;
  const lh = L.size * ST.capLineGap;
  const blockH = lh * L.lines.length;
  const cy = (c.y ?? (ST.capY0 + ST.capY1) / 2);
  ctx.save();
  ctx.setTransform(S * sc, 0, 0, S * sc, S * 270 * (1 - sc) + 0, S * cy * (1 - sc));
  // after transform, coordinates are design px scaled about (270, cy)
  ctx.font = capFontStr(L.size); ctx.letterSpacing = (ST.capTrack || 0) + 'px';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.miterLimit = 2;
  const drawPass = (pass) => {
    L.lines.forEach((line, i) => {
      let x = 270 - L.widths[i] / 2;
      const y = cy - blockH / 2 + lh * (i + 0.5) + L.size * 0.04;
      for (const w of line) {
        if (pass === 'shadow' && ST.capBlur) {
          ctx.save(); ctx.shadowColor = ST.capShadowCol; ctx.shadowBlur = ST.capBlur * S; ctx.shadowOffsetY = 2 * S;
          ctx.fillStyle = '#000'; ctx.fillText(w.w, x, y); ctx.restore();
        } else if (pass === 'shadow') {
          ctx.lineWidth = ST.capStroke; ctx.strokeStyle = '#000'; ctx.fillStyle = '#000';
          ctx.strokeText(w.w, x + ST.capShadow, y + ST.capShadow);
          ctx.fillText(w.w, x + ST.capShadow, y + ST.capShadow);
        } else if (pass === 'stroke') {
          if (!ST.capStroke) { x += w.width + L.space; continue; }
          ctx.lineWidth = ST.capStroke; ctx.strokeStyle = '#000';
          ctx.strokeText(w.w, x, y);
        } else {
          ctx.fillStyle = w.hl ? (c.color || ST.accent) : '#FFFFFF';
          ctx.fillText(w.w, x, y);
        }
        x += w.width + L.space;
      }
    });
  };
  drawPass('shadow'); drawPass('stroke'); drawPass('fill');
  ctx.letterSpacing = '0px';
  ctx.restore();
}

// ---------------- counter ----------------
function counterText(cn, f) {
  const v = cn.value(f / FPS);
  return (cn.format || fmtThousands)(v);
}
function drawCounter(cn, f) {
  const f0 = fr(cn.t0), f1 = fr(cn.t1);
  if (f < f0 || f >= f1) return;
  const txt = counterText(cn, f);
  // pulse: since last change of displayed value (stateless: look back), or explicit steps
  let since = Infinity;
  if (cn.steps) {
    for (const s of cn.steps) { const d = f - fr(s); if (d >= 0 && d < since) since = d; }
  } else {
    for (let d = 0; d < ST.pulseFrames && f - d - 1 >= f0; d++) {
      if (counterText(cn, f - d) !== counterText(cn, f - d - 1)) { since = d; break; }
    }
  }
  const pulse = since < ST.pulseFrames ? 1 - since / ST.pulseFrames : 0;
  const k = easeOut((f - f0) / 4);
  const inSc = 1.08 + (1 - 1.08) * k;
  if (f1 - f === 1) return; // hard cut out on last frame
  const y0 = ST.panelY0, y1 = ST.panelY1, w = cn.width || ST.panelW, h = y1 - y0;
  const cy = (y0 + y1) / 2;
  ctx.save();
  ctx.setTransform(S * inSc, 0, 0, S * inSc, S * 270 * (1 - inSc), S * cy * (1 - inSc));
  if (ST.look === 'documentary') {   // boxless: amber rule, tracked label, big Inter Tight value with soft shadow
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = cn.accent || ST.accent; ctx.fillRect(252, y0 + 6, 36, 2.5);
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 10 * S;
    ctx.font = `600 11px 'Inter Tight'`; ctx.letterSpacing = '3px'; ctx.fillStyle = 'rgba(255,255,255,0.78)';
    ctx.fillText(String(cn.label).toUpperCase(), 270 + 1.5, y0 + 24); ctx.letterSpacing = '0px';
    let vs = cn.valueSize || 40; ctx.font = `800 ${vs}px 'Inter Tight'`;
    while (ctx.measureText(txt).width > w + 60 && vs > 16) { vs -= 1; ctx.font = `800 ${vs}px 'Inter Tight'`; }
    const ps = 1 + (ST.pulseScale - 1) * pulse;
    ctx.translate(270, y0 + 60); ctx.scale(ps, ps); ctx.shadowBlur = 14 * S;
    ctx.fillStyle = pulse > 0 ? (cn.accent || ST.accent) : '#FFFFFF'; ctx.fillText(txt, 0, 0);
    ctx.restore(); return;
  }
  ctx.beginPath(); ctx.roundRect(270 - w / 2, y0, w, h, 14);
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.stroke(); // 1 design = 2 real px
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `500 12px 'Azeret Mono'`; ctx.letterSpacing = '2.5px';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText(String(cn.label).toUpperCase(), 270 + 1.25, y0 + 19);
  ctx.letterSpacing = '0px';
  // value: auto-shrink to panel width
  let vs = cn.valueSize || 34;
  ctx.font = `700 ${vs}px 'Azeret Mono'`;
  while (ctx.measureText(txt).width > w - 28 && vs > 14) { vs -= 1; ctx.font = `700 ${vs}px 'Azeret Mono'`; }
  const ps = 1 + (ST.pulseScale - 1) * pulse;
  const vy = y0 + 53;
  ctx.translate(270, vy); ctx.scale(ps, ps);
  ctx.fillStyle = pulse > 0 ? (cn.accent || ST.accent) : '#FFFFFF';
  ctx.fillText(txt, 0, 0);
  ctx.restore();
}

// ---------------- tags ----------------
function drawTag(tg, f) {
  if (f < fr(tg.t0) || f >= fr(tg.t1)) return;
  ctx.save(); ctx.setTransform(S, 0, 0, S, 0, 0);
  if (ST.look === 'documentary') { ctx.font = `600 9px 'Inter Tight'`; ctx.letterSpacing = '3px'; ctx.textBaseline = 'middle'; ctx.textAlign = tg.align || 'left';
    ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 6 * S; ctx.fillStyle = 'rgba(255,255,255,0.68)';
    ctx.fillText(String(tg.text).toUpperCase(), tg.x ?? ST.tagX, tg.y ?? ST.tagY); ctx.restore(); return; }
  ctx.font = `700 11px 'Azeret Mono'`; ctx.letterSpacing = '2.2px';
  ctx.textBaseline = 'middle';
  const align = tg.align || 'left';
  ctx.textAlign = align;
  const x = tg.x ?? (align === 'center' ? 270 : ST.tagX), y = tg.y ?? ST.tagY;
  ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  const t = String(tg.text).toUpperCase();
  ctx.strokeText(t, x, y);
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillText(t, x, y);
  ctx.restore();
}

// ---------------- v2 look (Studio v2, type A) ----------------
// Title + captions: Instrument Serif, accent words italic in the accent colour. Counter at mid-left: label (Inter Tight 600) /
// value (Space Grotesk 700, every digit in a fixed tabular cell, so ticking ms never jitter) / fact line. Soft dark radial
// bands sit behind title, counter and captions (A4: >= 3:1 contrast on bright skies). Design px on 540x960 (as the mock-up's CSS).
// Markup: '|' = line break; '*accent words*' (or the existing hl word list) = accent. Spec additions (all optional):
//   titles: [{t0, t1, text, hl?, fadeIn?, fadeOut?}]   (or title: {...})
//   counter: [{t0, t1, label: str|(t)=>str, value: (t)=>v, format?, fact?: str|(t)=>str, valueSize?, fadeIn?, fadeOut?}]
//     Segments that touch (next.t0 == prev.t1) form one block: no fade at the junction, label/value/format switch in place.
//   captions/titles/counter blocks fade in and out over V2.fade s (none at film start; fadeIn/fadeOut: 0 = hard).
const V2 = {
  fade: 0.15,
  title: { font: "'Instrument Serif'", size: 47, lh: 0.98, top: 170, maxW: 492, minSize: 34, shadow: [2, 16, 0.55] },
  cap: { font: "'Instrument Serif'", size: 34, lh: 1.0, top: 590, maxW: 430, minSize: 26, shadow: [2, 14, 0.65] },
  // CSS radial-gradient(ellipse rx% ry% at cx% cy%, rgba(6,10,18,a), transparent stop%) on box x,y,w,h
  titleBand: { x: 0, y: 120, w: 540, h: 230, cx: 0.5, cy: 0.5, rx: 0.70, ry: 0.60, stop: 0.72, a: 0.55 },
  ctrBand: { x: 0, y: 360, w: 320, h: 150, cx: 0.2, cy: 0.5, rx: 0.80, ry: 0.70, stop: 0.75, a: 0.5 },
  capBand: { a: 0.5, padX: 115, minRX: 190, padY: 40, plateau: [0.6, 0.75] },   // sized to the caption; flat core, soft edge
  ctr: { x: 22, y: 384, bar: 3, pad: 12, lab: { size: 9.5, ls: 2.6, op: 0.95 }, val: { size: 52, ls: -1 }, fact: { size: 8.5, ls: 2, op: 0.92 },
    gap: [5, 6], shadow: [2, 10, 0.6], maxW: 236 },
  tag: { x: 22, y: 118, size: 8, ls: 2.2, op: 0.8, shadow: [1, 4, 0.6] },
};
const V2M = {};              // DOM-measured line boxes: key -> { lh, base } (design px), tab -> tabular digit width per font
let SCR = null, sctx = null; // scratch layer: text is drawn here, then composited with ONE shadow (as CSS text-shadow)
const v2Font = { title: (s, em) => `${em ? 'italic ' : ''}400 ${s}px ${V2.title.font}`, cap: (s, em) => `${em ? 'italic ' : ''}400 ${s}px ${V2.cap.font}`,
  lab: () => `600 ${V2.ctr.lab.size}px 'Inter Tight'`, val: (s) => `700 ${s}px 'Space Grotesk'`, fact: () => `600 ${V2.ctr.fact.size}px 'Inter Tight'`,
  tag: () => `600 ${V2.tag.size}px 'Inter Tight'` };
function v2Measure() {
  const host = document.createElement('div'); host.style.cssText = 'position:absolute;left:0;top:0;visibility:hidden;width:540px';
  document.body.appendChild(host);
  const specs = { title: [v2Font.title(V2.title.size), String(V2.title.lh)], cap: [v2Font.cap(V2.cap.size), String(V2.cap.lh)],
    lab: [v2Font.lab(), 'normal'], val: [v2Font.val(V2.ctr.val.size), '1'], fact: [v2Font.fact(), 'normal'], tag: [v2Font.tag(), 'normal'] };
  for (const [k, [font, lh]] of Object.entries(specs)) {
    const d = document.createElement('div'); d.style.cssText = `font:${font};line-height:${lh};white-space:nowrap`;
    d.innerHTML = 'Hxg<span style="display:inline-block;width:0;height:0;vertical-align:baseline"></span>';
    host.appendChild(d);
    const r = d.getBoundingClientRect(), s = d.lastChild.getBoundingClientRect();
    V2M[k] = { lh: r.height, base: s.top - r.top };
    const t = document.createElement('span'); t.style.cssText = `font:${font};font-variant-numeric:tabular-nums;white-space:pre`; t.textContent = '0123456789';
    host.appendChild(t); V2M[k].tab = t.getBoundingClientRect().width / 10;
  }

// '*' toggles the accent, '|' breaks lines; without '*', words in hl get the accent (same matching as the old caption helper)
function v2Parse(text, hl) {
  if (!text.includes('*') && hl && hl.length) {
    const norm = (w) => String(w).toUpperCase().replace(/[^A-Z0-9×%]/g, ''); const H = hl.map(norm);
    text = text.split(/(\s+|\|)/).map((w) => (/\S/.test(w) && w !== '|' && H.includes(norm(w)) ? `*${w}*` : w)).join('');
  }
  const lines = []; let em = false;
  for (const raw of text.split('|')) {
    const s = raw.trim().replace(/\s+/g, ' '); if (!s) continue;
    const words = []; let segs = [], cur = '';

    for (const ch of s) {
      if (ch === '*') { flush(); em = !em; continue; }
      if (ch === ' ') { flush(); if (segs.length) words.push(segs); segs = []; continue; }
      cur += ch;
    }
    flush(); if (segs.length) words.push(segs);

}
function v2LineW(words, kind, size) {   // -> { w, ws: [word widths], sp: [space after word i] }
  const ws = [], sp = []; let w = 0;
  words.forEach((segs, i) => {
    let ww = 0; for (const g of segs) { ctx.font = v2Font[kind](size, g.em); ww += ctx.measureText(g.t).width; }
    ws.push(ww); w += ww;
    if (i < words.length - 1) { const em = segs[segs.length - 1].em && words[i + 1][0].em; ctx.font = v2Font[kind](size, em); const s = ctx.measureText(' ').width; sp.push(s); w += s; }
  });

}
const v2Cache = new Map();
function v2Layout(text, hl, kind) {     // fit: explicit lines; a too-wide single line splits in 2 (balanced); then shrink
  const key = kind + '\u0000' + text + '\u0000' + (hl || []).join(',');
  if (v2Cache.has(key)) return v2Cache.get(key);
  const P = V2[kind]; let lines = v2Parse(text, hl);
  ctx.save(); ctx.letterSpacing = '0px';
  if (lines.length === 1 && lines[0].length > 1 && v2LineW(lines[0], kind, P.size).w > P.maxW) {

  while (size > P.minSize && Math.max(...lines.map((l) => v2LineW(l, kind, size).w)) > P.maxW) size -= 0.5;

}
// draw a laid-out title/caption onto the scratch layer; returns the block's design-px box
function v2DrawText(L, kind, top) {
  const P = V2[kind], k = L.size / P.size, lh = V2M[kind].lh * k, base = V2M[kind].base * k;
  sctx.save(); sctx.setTransform(S, 0, 0, S, 0, 0); sctx.textBaseline = 'alphabetic'; sctx.textAlign = 'left'; sctx.letterSpacing = '0px';
  let maxW = 0;
  L.lines.forEach((ln, i) => {
    let x = 270 - ln.w / 2; const y = top + i * lh + base; maxW = Math.max(maxW, ln.w);
    ln.words.forEach((segs, j) => {
      for (const g of segs) { sctx.font = v2Font[kind](L.size, g.em); sctx.fillStyle = g.em ? ST.accent : '#FFFFFF'; sctx.fillText(g.t, x, y); x += sctx.measureText(g.t).width; }
      if (j < ln.sp.length) x += ln.sp[j];

}
// scratch box (design px, plus a shadow margin) -> main canvas with one CSS-like text shadow [offsetY, blur, opacity]
function v2Composite(box, shadow, alpha) {

const v2SizeCache = new Map();

  if (cn.valueSize) return cn.valueSize;

function v2Counter(cn, f, alpha) {

  const x = C.x + C.bar + C.pad;

function drawV2(f) {
  const vis = (it) => f >= fr(it.t0) && f < fr(it.t1);
  const titles = SPEC.titles.filter(vis), caps = SPEC.captions.filter(vis);
  const ctrs = SPEC.counter.map((cn, i) => ({ cn, i })).filter(({ cn }) => vis(cn));
  const joined = (a, b) => a && b && Math.abs(a.t1 - b.t0) < 1e-6;
  const ctrA = ctrs.map(({ cn, i }) => v2Alpha(cn, f, joined(SPEC.counter[i - 1], cn), joined(cn, SPEC.counter[i + 1])));
  const titleL = titles.map((tt) => ({ tt, L: v2Layout(tt.text, tt.hl, 'title'), a: v2Alpha(tt, f) }));
  const capL = caps.map((c) => ({ c, L: v2Layout(c.text, c.hl, 'cap'), a: v2Alpha(c, f) }));

  for (const { a } of titleL) v2Band(V2.titleBand, a);

  for (const { c, L, a } of capL) {
    const B = V2.capBand, lh = V2M.cap.lh * L.size / V2.cap.size, h = L.lines.length * lh, top = c.y ?? capTop(L), cy = top + h / 2;

  for (const { tt, L, a } of titleL) { if (a <= 0) continue; const box = v2DrawText(L, 'title', tt.y ?? V2.title.top); v2Composite(box, V2.title.shadow, a); n++; }

function normalizeSpec(raw) {
  const s = Object.assign({ captions: [], tags: [], counter: null }, raw);
  s.titles = [].concat(s.title || [], s.titles || []);
  if (s.counter && !Array.isArray(s.counter)) s.counter = [s.counter];
  s.counter = s.counter || [];
  for (const cn of s.counter) {
    if (typeof cn.value !== 'function') { const v = cn.value; cn.value = () => v; }
  }

window.ov = {
  async init(overlayUrl, info) {
    await document.fonts.load(`46px Anton`);
    await document.fonts.load(`500 12px 'Azeret Mono'`);
    await document.fonts.load(`700 12px 'Azeret Mono'`);
    for (const f of [`900 50px 'Big Shoulders Display'`, `800 50px 'Big Shoulders Display'`, `600 11px 'Inter Tight'`, `800 40px 'Inter Tight'`]) await document.fonts.load(f, '0123456789AZ×');
    for (const f of [`400 47px 'Instrument Serif'`, `italic 400 47px 'Instrument Serif'`, `700 52px 'Space Grotesk'`]) await document.fonts.load(f, '0123456789AZaz×');
    TOTAL = info.total;
    const mod = await import(overlayUrl);
    let raw = mod.default;
    if (typeof raw === 'function') raw = await raw(info);
    SPEC = normalizeSpec(raw);
    const st = SPEC.style || {};
    ST = Object.assign({}, DEFAULT_STYLE, LOOKS[st.look] || {}, st);
    if (ST.look === 'v2') v2Measure();
    return {
      captions: SPEC.captions.map(c => ({ t0: c.t0, t1: c.t1, text: c.text })),
      fonts: [...document.fonts].map(f => f.family + ':' + f.status),

  },
  draw(f) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (ST.look === 'v2') return drawV2(f);

    let n = 0;
    const anyText = SPEC.captions.some((c) => f >= fr(c.t0) && f < fr(c.t1)) || SPEC.counter.some((c) => f >= fr(c.t0) && f < fr(c.t1));

    for (const tg of SPEC.tags) { if (f >= fr(tg.t0) && f < fr(tg.t1)) { drawTag(tg, f); n++; } }
    for (const cn of SPEC.counter) { if (f >= fr(cn.t0) && f < fr(cn.t1)) { drawCounter(cn, f); n++; } }
    for (const c of SPEC.captions) { if (f >= fr(c.t0) && f < fr(c.t1)) { drawCaption(c, f); n++; } }

  // returns base64 PNG (or '' if the frame is empty)
  async frame(f) {
    const n = this.draw(f);
    if (!n) return '';
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const buf = new Uint8Array(await blob.arrayBuffer());
    let s = ''; const CH = 0x8000;

window.ovReady = true;
</script>
